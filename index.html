<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品管理工作台 · 登录</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#f7f8fb;color:#111827;display:grid;place-items:center}
  .login{width:min(420px,calc(100vw - 32px));background:#fff;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 18px 45px rgba(15,23,42,.08);padding:28px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  .mark{width:40px;height:40px;border-radius:8px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:700}
  h1{font-size:22px;line-height:1.25;margin:0}
  .sub{margin:4px 0 0;color:#6b7280;font-size:13px}
  label{display:block;font-size:13px;font-weight:600;color:#374151;margin:0 0 8px}
  input{width:100%;height:44px;border:1px solid #d1d5db;border-radius:6px;padding:0 12px;font-size:15px;outline:none}
  input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.14)}
  button{width:100%;height:44px;border:0;border-radius:6px;background:#4f46e5;color:#fff;font-size:15px;font-weight:650;cursor:pointer;margin-top:14px}
  button:disabled{opacity:.65;cursor:not-allowed}
  .msg{min-height:20px;margin-top:12px;font-size:13px;color:#6b7280}
  .msg.err{color:#dc2626}
  .foot{margin-top:22px;padding-top:18px;border-top:1px solid #eef0f4;color:#6b7280;font-size:12px;line-height:1.6}
  .links{display:flex;gap:10px;margin-top:10px}
  .links a{color:#4f46e5;text-decoration:none}
</style>
</head>
<body>
  <main class="login">
    <div class="brand">
      <div class="mark">PM</div>
      <div>
        <h1>产品管理工作台</h1>
        <p class="sub">输入访问码进入对应角色视角</p>
      </div>
    </div>

    <form id="loginForm">
      <label for="code">访问码</label>
      <input id="code" name="code" autocomplete="one-time-code" placeholder="请输入 8 位访问码" required>
      <button id="loginBtn" type="submit">登录</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="foot">
      登录成功后会从 Supabase 加载云端数据，并在本机保留缓存。
      <div class="links">
        <a href="director.html">产品总监入口</a>
        <a href="pm.html">项目经理入口</a>
      </div>
    </div>
  </main>

  <script src="assets/js/00-util.js"></script>
  <script src="assets/js/02b-data.js"></script>
  <script src="assets/js/cloud.js"></script>
  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var code = document.getElementById('code');
      var btn = document.getElementById('loginBtn');
      var msg = document.getElementById('msg');

      function setMsg(text, err) {
        msg.textContent = text || '';
        msg.className = 'msg' + (err ? ' err' : '');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var val = code.value.trim();
        if (!val) { setMsg('请输入访问码', true); return; }
        btn.disabled = true;
        btn.textContent = '正在登录...';
        setMsg('正在校验访问码并加载云端数据');

        CLOUD.login(val).then(function (res) {
          setMsg('登录成功，正在进入工作台');
          location.href = res.role === 'pm' ? 'pm.html' : 'director.html';
        }).catch(function (err) {
          setMsg(err.message || '登录失败', true);
        }).finally(function () {
          btn.disabled = false;
          btn.textContent = '登录';
        });
      });

      if (!CLOUD.ready()) {
        setMsg('请先在 assets/js/cloud.js 里配置 Supabase Function URL', true);
      }
    })();
  </script>
</body>
</html>
